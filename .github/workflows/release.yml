name: Build & Publish Releases (Windows, Linux, macOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows: Instalador .exe (NSIS) + Portátil .zip
          - platform: 'windows-latest'
            args: '--bundles nsis'
            os_name: 'windows'
          # 2. Linux: .rpm (Fedora), .deb (Ubuntu/Mint) e .AppImage (Portátil universal)
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,rpm,appimage'
            os_name: 'linux'
          # 3. macOS: .dmg para Apple Silicon (M1/M2/M3)
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin --bundles dmg'
            os_name: 'macos-arm64'
          # 4. macOS: .dmg para Intel
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin --bundles dmg'
            os_name: 'macos-x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências de Sistema no Linux (Ubuntu -> .deb, .rpm, .AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            dosfstools \
            rpm

      - name: Configurar Toolchain Rust Estável
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache de Dependências Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Compilar e Publicar Instaladores na Aba Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'XboxLiberator v__VERSION__ (Pronto para Uso)'
          releaseBody: |
            ## 🎮 Download Direto — XboxLiberator v__VERSION__
            Não é necessário instalar Rust ou compilar código! Escolha abaixo o instalador para o seu sistema operacional:
            - **🪟 Windows:** Baixe o arquivo `_x64-setup.exe` (ou o `.zip` portátil).
            - **🐧 Linux (Fedora / RHEL / openSUSE):** Baixe o arquivo `.rpm`.
            - **🐧 Linux (Ubuntu / Debian / Mint):** Baixe o arquivo `.deb`.
            - **🐧 Linux (Portátil Universal):** Baixe o arquivo `.AppImage`.
            - **🍎 macOS:** Baixe o arquivo `.dmg` (`aarch64` para Apple Silicon M1/M2/M3 ou `x64` para Intel).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Empacotar Versão Portátil Windows (.zip com payload incluso)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-portable/XboxLiberator-Windows-Portable
          Copy-Item "src-tauri/target/release/xboxliberator.exe" "dist-portable/XboxLiberator-Windows-Portable/XboxLiberator.exe"
          Copy-Item -Recurse "payload" "dist-portable/XboxLiberator-Windows-Portable/payload"
          Compress-Archive -Path "dist-portable/XboxLiberator-Windows-Portable/*" -DestinationPath "XboxLiberator-Windows-Portable.zip"

      - name: Anexar .zip Portátil do Windows na Release
        if: matrix.os_name == 'windows'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          files: XboxLiberator-Windows-Portable.zip
