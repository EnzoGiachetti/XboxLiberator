[package]
name = "xboxliberator"
version = "1.0.0"
description = "Utilitário automatizado para preparação de pendrives Xbox 360 (FAT32, Payload 1:1, Sync & Eject)"
authors = ["XboxLiberator Contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
walkdir = "2.5"
fs_extra = "1.3"

